name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  R2_BUCKET: labelle-releases
  R2_ENDPOINT: https://f74988a8ee5b060ad531fb71e5a78174.r2.cloudflarestorage.com

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    name: Build Linux x86_64
    steps:
      - uses: actions/checkout@v4
      # labelle-cli's pinned `labelle_assembler` package transitively
      # declares `flow_codegen` as a relative path-dep
      # (`../labelle-gui/flow-codegen`) — flow-codegen is an in-tree
      # sub-package of labelle-gui, not a fetchable repo. Check labelle-gui
      # out into BOTH locations the relative path resolves to: `zig-pkg/`
      # on Linux/macOS, repo-root on Windows (Zig 0.16 collapses the `..`
      # one segment further there). Mirrors the same fix in ci.yml.
      - name: Checkout labelle-gui (flow_codegen sub-package)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: zig-pkg/labelle-gui
      - name: Checkout labelle-gui (repo-root — Windows path resolution)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-gui
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline -Dversion=${GITHUB_REF#refs/tags/v}
      - uses: actions/upload-artifact@v4
        with:
          name: labelle-linux-x86_64
          path: zig-out/bin/labelle

  build-linux-arm64:
    runs-on: ubuntu-latest
    name: Build Linux ARM64
    steps:
      - uses: actions/checkout@v4
      # labelle-cli's pinned `labelle_assembler` package transitively
      # declares `flow_codegen` as a relative path-dep
      # (`../labelle-gui/flow-codegen`) — flow-codegen is an in-tree
      # sub-package of labelle-gui, not a fetchable repo. Check labelle-gui
      # out into BOTH locations the relative path resolves to: `zig-pkg/`
      # on Linux/macOS, repo-root on Windows (Zig 0.16 collapses the `..`
      # one segment further there). Mirrors the same fix in ci.yml.
      - name: Checkout labelle-gui (flow_codegen sub-package)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: zig-pkg/labelle-gui
      - name: Checkout labelle-gui (repo-root — Windows path resolution)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-gui
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux -Dversion=${GITHUB_REF#refs/tags/v}
      - uses: actions/upload-artifact@v4
        with:
          name: labelle-linux-arm64
          path: zig-out/bin/labelle

  build-macos-x86_64:
    runs-on: macos-latest
    name: Build macOS x86_64
    steps:
      - uses: actions/checkout@v4
      # labelle-cli's pinned `labelle_assembler` package transitively
      # declares `flow_codegen` as a relative path-dep
      # (`../labelle-gui/flow-codegen`) — flow-codegen is an in-tree
      # sub-package of labelle-gui, not a fetchable repo. Check labelle-gui
      # out into BOTH locations the relative path resolves to: `zig-pkg/`
      # on Linux/macOS, repo-root on Windows (Zig 0.16 collapses the `..`
      # one segment further there). Mirrors the same fix in ci.yml.
      - name: Checkout labelle-gui (flow_codegen sub-package)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: zig-pkg/labelle-gui
      - name: Checkout labelle-gui (repo-root — Windows path resolution)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-gui
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos -Dversion=${GITHUB_REF#refs/tags/v}
      - uses: actions/upload-artifact@v4
        with:
          name: labelle-darwin-x86_64
          path: zig-out/bin/labelle

  build-macos-arm64:
    runs-on: macos-latest
    name: Build macOS ARM64
    steps:
      - uses: actions/checkout@v4
      # labelle-cli's pinned `labelle_assembler` package transitively
      # declares `flow_codegen` as a relative path-dep
      # (`../labelle-gui/flow-codegen`) — flow-codegen is an in-tree
      # sub-package of labelle-gui, not a fetchable repo. Check labelle-gui
      # out into BOTH locations the relative path resolves to: `zig-pkg/`
      # on Linux/macOS, repo-root on Windows (Zig 0.16 collapses the `..`
      # one segment further there). Mirrors the same fix in ci.yml.
      - name: Checkout labelle-gui (flow_codegen sub-package)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: zig-pkg/labelle-gui
      - name: Checkout labelle-gui (repo-root — Windows path resolution)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-gui
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos -Dversion=${GITHUB_REF#refs/tags/v}
      - uses: actions/upload-artifact@v4
        with:
          name: labelle-darwin-arm64
          path: zig-out/bin/labelle

  build-windows-x86_64:
    runs-on: windows-latest
    name: Build Windows x86_64
    steps:
      - uses: actions/checkout@v4
      # labelle-cli's pinned `labelle_assembler` package transitively
      # declares `flow_codegen` as a relative path-dep
      # (`../labelle-gui/flow-codegen`) — flow-codegen is an in-tree
      # sub-package of labelle-gui, not a fetchable repo. Check labelle-gui
      # out into BOTH locations the relative path resolves to: `zig-pkg/`
      # on Linux/macOS, repo-root on Windows (Zig 0.16 collapses the `..`
      # one segment further there). Mirrors the same fix in ci.yml.
      - name: Checkout labelle-gui (flow_codegen sub-package)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: zig-pkg/labelle-gui
      - name: Checkout labelle-gui (repo-root — Windows path resolution)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-gui
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline "-Dversion=$($env:GITHUB_REF -replace 'refs/tags/v','')"
      - uses: actions/upload-artifact@v4
        with:
          name: labelle-windows-x86_64
          path: zig-out/bin/labelle.exe

  upload-r2:
    needs: [build-linux-x86_64, build-linux-arm64, build-macos-x86_64, build-macos-arm64, build-windows-x86_64]
    runs-on: ubuntu-latest
    name: Upload to R2
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # R2's S3 API needs a region for the AWS CLI to initialise (#297).
          AWS_DEFAULT_REGION: auto
          # aws v2 (the preinstalled CLI) sends integrity checksums that R2
          # rejects; `when_required` restricts them to operations that
          # actually need them. Without these, dropping the pip v1 install
          # below swaps a PEP-668 failure for a checksum-rejection failure.
          # Same settings labelle-studio's working R2 upload uses.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # Use the aws CLI preinstalled on ubuntu-latest (v2). NOT
          # `pip install awscli` — that installs v1 into the system Python
          # and fails on PEP-668 (externally-managed-environment) once the
          # runner image enforces it, breaking the release before any
          # upload runs (#297). Higher-stakes than the assembler's mirror
          # of this bug: studio has no GitHub fallback for the CLI sidecar,
          # so a CLI R2 outage is user-visible in every bundle build.
          VERSION=${GITHUB_REF#refs/tags/}

          for dir in artifacts/*/; do
            name=$(basename "$dir")
            for file in "$dir"*; do
              aws s3 cp "$file" "s3://$R2_BUCKET/cli/$VERSION/$name" \
                --endpoint-url "$R2_ENDPOINT"
            done
          done

          echo "$VERSION" | aws s3 cp - "s3://$R2_BUCKET/cli/latest.txt" \
            --endpoint-url "$R2_ENDPOINT"

          echo "Released $VERSION to R2"
