# Provision-from-zero validation for the managed build toolchain (cli#291).
#
# The unit suite can't catch what breaks on a clean machine: download URLs
# rotting, checksums drifting, extraction quirks (Windows bsdtar vs GNU tar),
# PATH/env wiring. These jobs exercise the REAL provisioning commands
# (`labelle install zig` / `install python`) from a bare runner on the two
# platforms the managed toolchain targets, plus the doctor --json contract
# the studio's ToolchainGate consumes.
#
# A target's own toolchain (the browser one included) is its provider's to
# provision and validate from zero: see the provider package's CI.
name: Toolchain provisioning

# Manual only since 2026-09-28 (e2e suites were moved out of per-PR CI).
on:
  workflow_dispatch:

# Least-privilege token: these jobs only read the repo (zizmor, PR #291 review).
permissions:
  contents: read

jobs:
  provision-from-zero:
    name: Provision toolchain from zero (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Bounded: toolchain downloads through slow mirrors must fail, not hang
    # for the runner's multi-hour default (PR #291 review).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes back; don't persist the injected git
          # credentials into the workspace (zizmor, PR #291 review).
          persist-credentials: false

      # Zig is needed once, to BUILD the CLI under test — the managed-Zig
      # provisioning below is exercised through that CLI, not this install.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build CLI
        shell: bash
        run: zig build

      - name: Provision managed Zig from zero
        shell: bash
        run: |
          set -e
          # Read the paired default straight from the source constant —
          # scraping it from the CLI's missing-argument usage output exits
          # nonzero by design and trips `set -e` (first CI run of this job).
          VERSION=$(grep -oE 'DEFAULT_ZIG_VERSION = "[^"]+"' src/cli/zig_toolchain.zig | cut -d'"' -f2)
          echo "paired default zig: $VERSION"
          ./zig-out/bin/labelle install zig "$VERSION"

      - name: Provision managed Python from zero
        shell: bash
        run: ./zig-out/bin/labelle install python

      - name: doctor --json reports python ok + fixable contract
        shell: bash
        run: |
          set -e
          ./zig-out/bin/labelle doctor --json | tee doctor.json
          python3 - <<'PYEOF'
          import json
          report = json.load(open('doctor.json'))
          caps = {c['id']: c for c in report['capabilities']}
          assert caps['python']['required'] is False, caps['python']
          assert caps['python']['ok'], f"python capability not ok after provisioning: {caps['python']}"
          items = {i['id']: i for i in caps['python']['items']}
          assert items['python']['ok'], f"python item not ok after provisioning: {items['python']}"
          assert items['python']['fixable'], "python item must be fixable on managed platforms"
          assert items['python']['action'] == 'labelle install python', items['python']['action']
          print('doctor contract ok:', items['python'])
          PYEOF
