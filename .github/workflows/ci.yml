name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Build and Test (${{ matrix.os }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The labelle_assembler git package's build.zig.zon declares
      # flow_codegen as a relative path-dep (`../labelle-gui/flow-codegen`).
      # flow-codegen is an in-tree sub-package of labelle-gui (not its own
      # repo), so it cannot be a fetchable git dep — checking labelle-gui
      # out into the spot the relative path resolves to is the supported
      # workaround, mirroring labelle-assembler's own CI.
      #
      # That resolution differs by OS: on ubuntu/macos Zig 0.16 resolves
      # `../labelle-gui/flow-codegen` to `<project>/zig-pkg/labelle-gui/
      # flow-codegen`, but on windows-latest path-join normalization
      # collapses the `..` differently and it resolves straight to the
      # repo root, `<project>/labelle-gui/flow-codegen`. Check labelle-gui
      # out into BOTH locations so all three OS jobs resolve the dep — a
      # redundant shallow checkout is cheap.
      - name: Checkout labelle-gui (flow_codegen sub-package, zig-pkg path)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: zig-pkg/labelle-gui

      - name: Checkout labelle-gui (flow_codegen sub-package, repo-root path)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-gui

      # labelle-cli #217: the CLI is a thin driver — `clean`, `init`,
      # etc. delegate to the standalone labelle-assembler binary, so CI
      # must build one for the "Test CLI commands" steps.
      - name: Checkout labelle-assembler
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build CLI
        run: zig build

      - name: CLI tests
        run: zig build test

      - name: Build assembler
        run: cd labelle-assembler && zig build

      - name: Test CLI commands (Unix)
        if: runner.os != 'Windows'
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
        run: |
          set -e
          # help and version should always work
          ./zig-out/bin/labelle help
          ./zig-out/bin/labelle version

          # clean --dry-run without project.labelle should succeed gracefully
          ./zig-out/bin/labelle clean --dry-run

          # clean should reject unknown flags
          if ./zig-out/bin/labelle clean --bogus 2>&1; then
            echo "ERROR: clean should have rejected unknown flag"
            exit 1
          fi

          # init a project, then clean --dry-run with project context
          mkdir -p /tmp/test-cli-commands && cd /tmp/test-cli-commands
          $GITHUB_WORKSPACE/zig-out/bin/labelle init test_project
          cd test_project
          $GITHUB_WORKSPACE/zig-out/bin/labelle clean --dry-run

      - name: Test CLI commands (Windows)
        if: runner.os == 'Windows'
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}\labelle-assembler\zig-out\bin\labelle-assembler.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cli = "$env:GITHUB_WORKSPACE\zig-out\bin\labelle.exe"

          & $cli help
          & $cli version
          & $cli clean --dry-run

          # clean should reject unknown flags
          $output = & $cli clean --bogus 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Error "clean should have rejected unknown flag"
            exit 1
          }

          # init + clean with project context
          $testDir = "$env:TEMP\test-cli-commands"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          Push-Location $testDir
          & $cli init test_project
          Push-Location test_project
          & $cli clean --dry-run
          Pop-Location
          Pop-Location

  docker-build:
    name: Docker Build Test
    # Validates the WASM/emscripten workarounds for the two Zig 0.16.0
    # release bugs (both reproduce on the official tarball, not pip-specific):
    #   * std/Io/Threaded.zig SIG__enum vs u32 mismatch — patched in the
    #     Dockerfile via a one-line sed cherry-pick of Zig PR #31850
    #     (see src/cli/docker.zig: install_zig).
    #   * translate-c rejects emscripten 4.0.9's multi-arg
    #     __attribute__((deprecated("msg1","msg2"))) — sidestepped by a
    #     hand-rolled extern shim in the assembler's wasm.txt template
    #     (no @cImport(emscripten.h)).
    # Drop the workarounds once Zig 0.16.1+ + translate-c #306 land.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout labelle-cli
        uses: actions/checkout@v4
        with:
          path: labelle-cli

      - name: Checkout sibling dependencies
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-core
          ref: main
          path: labelle-core

      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-engine
          ref: main
          path: labelle-engine

      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gfx
          ref: main
          path: labelle-gfx

      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler

      # labelle-assembler's build.zig.zon has a `.path = "../labelle-gui/flow-codegen"`
      # entry, so building it as a sibling repo requires labelle-gui as a
      # sibling checkout.
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-gui

      # When labelle-cli builds, labelle_assembler is consumed as a git
      # package unpacked into `labelle-cli/zig-pkg/`; the same path-dep
      # then resolves to `labelle-cli/zig-pkg/labelle-gui/flow-codegen`.
      # Check labelle-gui out there too so `cd labelle-cli && zig build`
      # resolves the transitive flow_codegen dep.
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build CLI
        run: cd labelle-cli && zig build

      - name: Build assembler
        run: cd labelle-assembler && zig build

      - name: Test --docker WASM build
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
        run: |
          mkdir -p test-docker && cd test-docker
          ../labelle-cli/zig-out/bin/labelle init docker_test \
            --backend=raylib --ecs=zig_ecs \
            --core-version="local:../../labelle-core" \
            --engine-version="local:../../labelle-engine" \
            --gfx-version="local:../../labelle-gfx" \
            --labelle-version="local:../../labelle-cli" \
            --assembler-version="local:../../labelle-assembler"
          cd docker_test
          ../../labelle-cli/zig-out/bin/labelle build --docker --platform=wasm
          test -f .labelle/raylib_wasm/zig-out/web/game.wasm
          echo "Docker WASM build produced game.wasm"

  versions-integration:
    name: Versions Integration Test
    runs-on: ubuntu-latest
    env:
      LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler

    steps:
      - name: Checkout labelle-cli
        uses: actions/checkout@v4
        with:
          path: labelle-cli

      - name: Checkout sibling dependencies
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-core
          ref: main
          path: labelle-core

      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-engine
          ref: main
          path: labelle-engine

      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gfx
          ref: main
          path: labelle-gfx

      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler

      # labelle-assembler's build.zig.zon has a `.path = "../labelle-gui/flow-codegen"`
      # entry, so building it as a sibling repo requires labelle-gui as a
      # sibling checkout.
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-gui

      # When labelle-cli builds, labelle_assembler is consumed as a git
      # package unpacked into `labelle-cli/zig-pkg/`; the same path-dep
      # then resolves to `labelle-cli/zig-pkg/labelle-gui/flow-codegen`.
      # Check labelle-gui out there too so `cd labelle-cli && zig build`
      # resolves the transitive flow_codegen dep.
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libsdl2-dev

      - name: Build CLI
        run: cd labelle-cli && zig build

      - name: Build assembler
        run: cd labelle-assembler && zig build

      - name: Init, generate, and build a project
        run: |
          mkdir -p test-projects && cd test-projects
          ../labelle-cli/zig-out/bin/labelle init test_game --backend=raylib --ecs=zig_ecs \
            --core-version="local:../../labelle-core" \
            --engine-version="local:../../labelle-engine" \
            --gfx-version="local:../../labelle-gfx" \
            --labelle-version="local:../../labelle-cli" \
            --assembler-version="local:../../labelle-assembler"
          cd test_game
          ../../labelle-cli/zig-out/bin/labelle generate
          cd .labelle/raylib_desktop
          zig build

      # Released-path smoke (labelle-cli#322): init with NO local overrides —
      # the exact cold-user path. Resolves DEFAULT_ASSEMBLER_VERSION from
      # GitHub releases and scaffolds that binary's curated package pins, then
      # generates and builds against the RELEASED tarballs. This is the guard
      # the local-override test above cannot provide: it fails if the paired
      # default rots (the 0.40.0 constant sat stale for months, scaffolding
      # projects with no .y_axis and tag-stamped pins that the current
      # assembler line refuses to build) or if the curated set stops being
      # mutually compatible.
      - name: Released-path init smoke (no local overrides)
        run: |
          set -e
          unset LABELLE_ASSEMBLER
          mkdir -p test-projects-released && cd test-projects-released
          ../labelle-cli/zig-out/bin/labelle init cold_game --backend=raylib --ecs=zig_ecs
          echo "── scaffolded project.labelle ──"
          cat cold_game/project.labelle
          grep -q '\.y_axis = ' cold_game/project.labelle || { echo "FAIL: scaffold missing .y_axis"; exit 1; }
          cd cold_game
          ../../labelle-cli/zig-out/bin/labelle generate
          cd .labelle/raylib_desktop
          zig build

      - name: Plugin manifest system test
        run: |
          set -e
          cd labelle-cli/test/plugin-manifest-test
          CLI="$GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle"

          # Backup the original manifest as a file rather than a shell
          # variable. `echo "$ORIG"` is not reliably lossless — it can
          # interpret escapes, collapse trailing newlines, or mis-handle
          # a leading `-n`/`-e`. Copying preserves content byte-for-byte.
          cp fake-fsm-plugin/plugin.labelle fake-fsm-plugin/plugin.labelle.orig

          cleanup() {
            cp fake-fsm-plugin/plugin.labelle.orig fake-fsm-plugin/plugin.labelle
            rm -f fake-fsm-plugin/plugin.labelle.orig
            rm -f fake-other-plugin/plugin.labelle
            rm -rf .labelle labelle.lock
          }
          trap cleanup EXIT

          # --- Happy path: plugin.labelle is read and state_machines/
          # is copied into the generated build target. Second plugin
          # (fake-other-plugin) has no manifest — exercises the
          # manifest-less plugin path too. ---
          "$CLI" generate
          test -f .labelle/raylib_desktop/state_machines/probe_machine.zig
          echo "OK: happy path copied state_machines/probe_machine.zig"
          rm -rf .labelle labelle.lock

          # --- Same plugin declaring same name with two extensions is
          # allowed (RFC Q3 multi-extension pattern) ---
          cat > fake-fsm-plugin/plugin.labelle << 'EOF'
          .{
              .name = "fsm_test",
              .manifest_version = 1,
              .convention_dirs = .{
                  .{ .name = "state_machines", .extension = ".zig", .mode = .copy_and_scan },
                  .{ .name = "state_machines", .extension = ".zon", .mode = .copy_and_scan },
              },
          }
          EOF
          if ! "$CLI" generate > /dev/null 2>&1; then
            echo "FAIL: multi-extension same-plugin pattern should have succeeded"
            exit 1
          fi
          test -f .labelle/raylib_desktop/state_machines/probe_machine.zig
          echo "OK: multi-extension same-plugin pattern accepted"
          cp fake-fsm-plugin/plugin.labelle.orig fake-fsm-plugin/plugin.labelle
          rm -rf .labelle labelle.lock

          # --- Cross-plugin duplicate: fake-other-plugin claims the
          # same directory name — must fail ---
          cat > fake-other-plugin/plugin.labelle << 'EOF'
          .{
              .name = "other_plugin",
              .manifest_version = 1,
              .convention_dirs = .{
                  .{ .name = "state_machines", .extension = ".zig", .mode = .copy_and_scan },
              },
          }
          EOF
          if "$CLI" generate > /dev/null 2>&1; then
            echo "FAIL: cross-plugin duplicate should have errored"
            exit 1
          fi
          echo "OK: cross-plugin duplicate rejected"
          rm -f fake-other-plugin/plugin.labelle
          rm -rf .labelle labelle.lock

          # --- Missing extension on copy_and_scan must fail ---
          cat > fake-fsm-plugin/plugin.labelle << 'EOF'
          .{
              .name = "fsm_test",
              .manifest_version = 1,
              .convention_dirs = .{
                  .{ .name = "state_machines", .mode = .copy_and_scan },
              },
          }
          EOF
          if "$CLI" generate > /dev/null 2>&1; then
            echo "FAIL: missing extension should have errored"
            exit 1
          fi
          echo "OK: missing extension rejected"

          # --- Reserved dir name must fail ---
          cat > fake-fsm-plugin/plugin.labelle << 'EOF'
          .{
              .name = "fsm_test",
              .manifest_version = 1,
              .convention_dirs = .{
                  .{ .name = "components", .extension = ".zig", .mode = .copy_and_scan },
              },
          }
          EOF
          if "$CLI" generate > /dev/null 2>&1; then
            echo "FAIL: reserved dir name should have errored"
            exit 1
          fi
          echo "OK: reserved dir name rejected"

          # --- Path traversal must fail ---
          cat > fake-fsm-plugin/plugin.labelle << 'EOF'
          .{
              .name = "fsm_test",
              .manifest_version = 1,
              .convention_dirs = .{
                  .{ .name = "../../etc", .extension = ".zig", .mode = .copy_and_scan },
              },
          }
          EOF
          if "$CLI" generate > /dev/null 2>&1; then
            echo "FAIL: path traversal should have errored"
            exit 1
          fi
          echo "OK: path traversal rejected"

          # --- Unknown manifest_version (too high) must fail ---
          cat > fake-fsm-plugin/plugin.labelle << 'EOF'
          .{
              .name = "fsm_test",
              .manifest_version = 99,
              .convention_dirs = .{
                  .{ .name = "state_machines", .extension = ".zig", .mode = .copy_and_scan },
              },
          }
          EOF
          if "$CLI" generate > /dev/null 2>&1; then
            echo "FAIL: unknown manifest_version should have errored"
            exit 1
          fi
          echo "OK: unknown manifest_version rejected"

          # --- manifest_version = 0 must fail ---
          cat > fake-fsm-plugin/plugin.labelle << 'EOF'
          .{
              .name = "fsm_test",
              .manifest_version = 0,
              .convention_dirs = .{
                  .{ .name = "state_machines", .extension = ".zig", .mode = .copy_and_scan },
              },
          }
          EOF
          if "$CLI" generate > /dev/null 2>&1; then
            echo "FAIL: manifest_version = 0 should have errored"
            exit 1
          fi
          echo "OK: manifest_version = 0 rejected"

          # --- Name mismatch must fail ---
          cat > fake-fsm-plugin/plugin.labelle << 'EOF'
          .{
              .name = "wrong_name",
              .manifest_version = 1,
              .convention_dirs = .{
                  .{ .name = "state_machines", .extension = ".zig", .mode = .copy_and_scan },
              },
          }
          EOF
          if "$CLI" generate > /dev/null 2>&1; then
            echo "FAIL: name mismatch should have errored"
            exit 1
          fi
          echo "OK: name mismatch rejected"

          # trap cleanup restores the original manifest, deletes the
          # temporary fake-other-plugin/plugin.labelle, and wipes artifacts
          echo "plugin-manifest system test: all cases passed"
